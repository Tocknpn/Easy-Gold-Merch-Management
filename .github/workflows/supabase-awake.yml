name: Supabase Keep Alive

# Supabase free tier pauses a project after 7 days without activity.
# Ping DAILY so several missed/failed runs in a row still stay well inside
# that window (the old every-3-days schedule only tolerated one failure).

on:
  schedule:
    # 03:17 UTC daily. Off the top of the hour, where GitHub delays/drops
    # scheduled runs under load.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    # Pinned: ubuntu-latest is migrating to Ubuntu 26 and the 11-10 / 11-13
    # runs failed with curl exit 6 (could not resolve host).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Ping Supabase REST endpoint
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          API_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -u
          # Strip whitespace/newlines that can sneak into pasted secrets, and a trailing slash
          CLEAN_URL="$(printf '%s' "${RAW_URL:-}" | tr -d '[:space:]')"
          CLEAN_URL="${CLEAN_URL%/}"
          API_KEY="$(printf '%s' "${API_KEY:-}" | tr -d '[:space:]')"

          if [ -z "$CLEAN_URL" ] || [ -z "$API_KEY" ]; then
            echo "::error::Missing Supabase URL or Anon Key secrets!"
            exit 1
          fi

          HOST="$(printf '%s' "$CLEAN_URL" | sed -E 's#^https?://##; s#/.*$##')"
          echo "Target host: $HOST"

          # Outer retry loop (~10 min total) covers DNS hiccups on the runner;
          # curl's own --retry handles transient HTTP/connection errors.
          for attempt in 1 2 3 4 5 6; do
            echo "--- Attempt $attempt ---"
            getent hosts "$HOST" || echo "DNS lookup for $HOST failed (will still try curl)"

            if curl -f -sS -X POST "${CLEAN_URL}/rest/v1/project_heartbeat" \
                --connect-timeout 20 --max-time 60 \
                --retry 3 --retry-delay 10 --retry-all-errors \
                -H "apikey: ${API_KEY}" \
                -H "Authorization: Bearer ${API_KEY}" \
                -H "Content-Type: application/json" \
                -H "Prefer: return=minimal" \
                -d '{"source": "github_actions"}'; then
              echo "Heartbeat inserted OK."
              exit 0
            fi

            echo "Attempt $attempt failed; waiting before retry..."
            sleep $(( attempt * 30 ))
          done

          echo "::error::All heartbeat attempts failed. Check the Supabase project is not paused and secrets are valid."
          exit 1
