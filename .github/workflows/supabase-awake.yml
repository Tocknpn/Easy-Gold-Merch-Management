name: Supabase Keep Alive

on:
  schedule:
    # Runs at 04:00 UTC every 3 days
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          API_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$RAW_URL" ] || [ -z "$API_KEY" ]; then
            echo "::error::Missing Supabase URL or Anon Key secrets!"
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${RAW_URL%/}"

          echo "Pinging ${CLEAN_URL}/rest/v1/project_heartbeat ..."
          curl -f -sS -X POST "${CLEAN_URL}/rest/v1/project_heartbeat" \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"source": "github_actions"}'


